<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursor Bot Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
    }

    /* ── Sidebar ─────────────────────────────────────────── */
    #sidebar {
      width: 196px;
      min-height: 100vh;
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-logo {
      padding: 18px 16px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      border-bottom: 1px solid #e2e8f0;
      letter-spacing: -0.01em;
    }

    .sidebar-logo span { color: #3b82f6; }

    .sidebar-section {
      padding: 14px 16px 5px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
    }

    .sidebar-item {
      padding: 7px 12px;
      font-size: 13px;
      color: #475569;
      cursor: pointer;
      border-radius: 7px;
      margin: 1px 6px;
      transition: background 0.1s, color 0.1s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-item:hover { background: #f1f5f9; color: #0f172a; }

    .sidebar-item.active {
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 600;
    }

    .sidebar-item .sq-badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 600;
    }

    .sb-high  { background: #dcfce7; color: #16a34a; }
    .sb-mid   { background: #dbeafe; color: #1d4ed8; }
    .sb-low   { background: #ffedd5; color: #ea580c; }
    .sb-none  { background: #f1f5f9; color: #94a3b8; }

    /* ── Main ────────────────────────────────────────────── */
    #main {
      flex: 1;
      padding: 28px 32px;
      overflow-y: auto;
      min-width: 0;
    }

    .view-header { margin-bottom: 24px; }
    .view-title  { font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
    .view-sub    { font-size: 13px; color: #64748b; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* ── KPI grid ────────────────────────────────────────── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 1000px) { .kpi-grid { grid-template-columns: repeat(2,1fr); } }

    .kpi-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px 20px;
    }

    .kpi-label { font-size: 12px; color: #64748b; margin-bottom: 6px; font-weight: 500; }
    .kpi-value { font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }

    /* ── Chart cards ─────────────────────────────────────── */
    .charts-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    .charts-row.single { grid-template-columns: 1fr; }
    @media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }

    .chart-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px 24px;
    }

    .chart-title { font-size: 14px; font-weight: 600; color: #0f172a; margin-bottom: 16px; }

    /* ── Ranking ─────────────────────────────────────────── */
    .rank-list { display: flex; flex-direction: column; gap: 9px; }

    .rank-row { display: flex; align-items: center; gap: 10px; }

    .rank-idx  { width: 16px; font-size: 11px; color: #94a3b8; text-align: right; flex-shrink: 0; }
    .rank-name { width: 44px; font-size: 12px; font-weight: 600; color: #334155; flex-shrink: 0; }

    .rank-bar-wrap {
      flex: 1;
      background: #f1f5f9;
      border-radius: 4px;
      height: 12px;
      overflow: hidden;
    }

    .rank-bar { height: 100%; border-radius: 4px; }

    .rank-pct { width: 36px; text-align: right; font-size: 12px; font-weight: 700; flex-shrink: 0; }

    .c-high  { color: #16a34a; }
    .c-mid   { color: #2563eb; }
    .c-low   { color: #ea580c; }
    .c-none  { color: #94a3b8; }
    .b-high  { background: #16a34a; }
    .b-mid   { background: #2563eb; }
    .b-low   { background: #ea580c; }

    /* ── Trend badge ──────────────────────────────────────── */
    .trend {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .trend-up   { background: #dcfce7; color: #16a34a; }
    .trend-down { background: #fee2e2; color: #dc2626; }
    .trend-flat { background: #f1f5f9; color: #64748b; }

    /* ── Loading / error ──────────────────────────────────── */
    #loading {
      position: fixed;
      inset: 0;
      background: rgba(248,250,252,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 200;
    }

    .spinner {
      width: 38px; height: 38px;
      border: 3px solid #e2e8f0;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text  { font-size: 14px; color: #64748b; font-weight: 500; }
    .loading-sub   { font-size: 12px; color: #94a3b8; }

    #loading.hidden { display: none; }

    /* ── Empty / error state ──────────────────────────────── */
    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
    }

    /* ── Last updated ─────────────────────────────────────── */
    .last-updated {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 28px;
      text-align: right;
    }

    /* ── Progress bar while loading squads ───────────────── */
    #progress-bar-wrap {
      width: 220px;
      background: #e2e8f0;
      border-radius: 99px;
      height: 4px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      background: #3b82f6;
      border-radius: 99px;
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div class="sidebar-logo">🤖 <span>Cursor</span> Bot</div>
  <div class="sidebar-section">General</div>
  <div class="sidebar-item active" data-view="global" onclick="switchView('global')">
    Vista global
  </div>
  <div class="sidebar-section">Squads</div>
  <div id="squad-list">
    <!-- populated by JS -->
  </div>
</div>

<!-- Main panel -->
<div id="main">
  <div id="view-global"></div>
  <div id="view-squad"  style="display:none"></div>
</div>

<!-- Loading overlay -->
<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">Cargando datos desde Jira...</div>
  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  <div class="loading-sub" id="loading-sub">Esto puede tardar 30-60 segundos</div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────────────────────────────────────
const JIRA_CONFIG = {
  baseUrl:      'https://humand.atlassian.net',
  // Generá tu token: F12 → Console → btoa('tu-email@humand.co:TU_API_TOKEN')
  // API tokens: https://id.atlassian.com/manage-profile/security/api-tokens
  token:        'Basic ZGVsZmluYS5waXBhbkBodW1hbmQuY286QVRBVFQzeEZmR0YwWnBmNTJNRFQ0Uk1WRnFSZ0ctanU2WVJMZV9CZXNqcXkxbmNkekt6U0NWMzBpV0ZTV1pTNWdKTUZKT2FoaWdiSUU5dDhGTUMyNXlVcUFHRDVpb2RRc3RGQy1FaVNrQXl3UFJPU1FlR3VMRkpRWnc1SG1GZkJQMkFGa1UxZmpSX0VTazVOYnlHSEkzQ1hsNFJTVS1ab1ZrNTRtdUdiYkpmWGdoNWhETGpBQkV3PTExODdENUYz',
  botAccountId: '712020:98b3a270-fe83-4788-9d35-e5b5611a7a64',
  startDate:    '2025-02-24',
  squads: [
    'SQZB','SQSQ','SQSH','SQRN','SQRC','SQPM','SQPD',
    'SQOW','SQOT','SQKA','SQJG','SQGZ','SQEG','SQDP',
    'SQXS','SQCY','SQWH'
  ]
};

// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
const state = {
  squadData:   {},   // { [squad]: { sprints:[...], error:null|string } }
  globalStats: null,
  currentView: 'global',
  chartInstances: {}
};

// ─────────────────────────────────────────────────────────────────────────────
// API LAYER
// ─────────────────────────────────────────────────────────────────────────────
async function jiraFetch(path) {
  const res = await fetch(`${JIRA_CONFIG.baseUrl}${path}`, {
    headers: {
      'Authorization': JIRA_CONFIG.token,
      'Accept': 'application/json'
    }
  });
  if (!res.ok) throw new Error(`Jira ${res.status} → ${path.split('?')[0]}`);
  return res.json();
}

async function getBoardId(squad) {
  const data = await jiraFetch(
    `/rest/agile/1.0/board?projectKeyOrId=${squad}&type=scrum&maxResults=1`
  );
  if (!data.values || data.values.length === 0) return null;
  return data.values[0].id;
}

async function getSprints(boardId) {
  const data = await jiraFetch(
    `/rest/agile/1.0/board/${boardId}/sprint?state=closed,active&maxResults=100`
  );
  const cutoff = new Date(JIRA_CONFIG.startDate);
  return (data.values || [])
    .filter(s => s.startDate && new Date(s.startDate) >= cutoff)
    .sort((a, b) => new Date(a.startDate) - new Date(b.startDate));
}

async function getIssueCount(squad, sprintId, botOnly) {
  const assigneeClause = botOnly
    ? ` AND assignee = "${JIRA_CONFIG.botAccountId}"`
    : '';
  const jql = `project = "${squad}" AND issuetype in (Subtask, "Sub-task", "Dev Task") AND status = Done AND sprint = ${sprintId}${assigneeClause}`;
  const data = await jiraFetch(
    `/rest/api/3/search?jql=${encodeURIComponent(jql)}&maxResults=0&fields=id`
  );
  return data.total || 0;
}

// ─────────────────────────────────────────────────────────────────────────────
// DATA LAYER
// ─────────────────────────────────────────────────────────────────────────────
async function loadSquad(squad) {
  try {
    const boardId = await getBoardId(squad);
    if (!boardId) return { sprints: [], error: 'Sin board Scrum' };

    const sprints = await getSprints(boardId);
    if (sprints.length === 0) return { sprints: [], error: 'Sin sprints desde Feb 2025' };

    const sprintData = await Promise.all(sprints.map(async s => {
      const [botCount, totalCount] = await Promise.all([
        getIssueCount(squad, s.id, true),
        getIssueCount(squad, s.id, false)
      ]);
      return { id: s.id, name: s.name, startDate: s.startDate, botCount, totalCount };
    }));

    return { sprints: sprintData, error: null };
  } catch (err) {
    return { sprints: [], error: err.message };
  }
}

function computeGlobalStats() {
  const squads = JIRA_CONFIG.squads;
  let totalBotTasks = 0;
  let activeSquads  = 0;
  const adoptionRates = [];
  const evolutionMap  = {};
  const ranking = [];
  const allSprintNames = new Set();

  for (const squad of squads) {
    const d = state.squadData[squad];
    if (!d || d.error || d.sprints.length === 0) continue;

    const squadBot   = d.sprints.reduce((s, x) => s + x.botCount,   0);
    const squadTotal = d.sprints.reduce((s, x) => s + x.totalCount, 0);
    if (squadBot === 0) continue;

    activeSquads++;
    totalBotTasks += squadBot;

    const adoption = squadTotal > 0 ? Math.round((squadBot / squadTotal) * 100) : 0;
    adoptionRates.push(adoption);
    ranking.push({ squad, adoption, botCount: squadBot, totalCount: squadTotal });

    for (const s of d.sprints) {
      allSprintNames.add(s.name);
      evolutionMap[s.name] = (evolutionMap[s.name] || 0) + s.botCount;
    }
  }

  ranking.sort((a, b) => b.adoption - a.adoption);

  // Build evolution sorted by startDate
  const evolutionEntries = Object.entries(evolutionMap).map(([name, botCount]) => {
    let startDate = null;
    for (const squad of squads) {
      const d = state.squadData[squad];
      if (!d) continue;
      const f = d.sprints.find(s => s.name === name);
      if (f) { startDate = f.startDate; break; }
    }
    return { name, botCount, startDate };
  }).sort((a, b) => new Date(a.startDate) - new Date(b.startDate));

  const avgAdoption = adoptionRates.length > 0
    ? Math.round(adoptionRates.reduce((a, b) => a + b, 0) / adoptionRates.length)
    : 0;

  return {
    totalBotTasks,
    sprintsCount: allSprintNames.size,
    activeSquads,
    avgAdoption,
    evolution: evolutionEntries,
    ranking
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function adoptionColor(pct) {
  if (pct >= 75) return 'c-high';
  if (pct >= 50) return 'c-mid';
  return 'c-low';
}

function adoptionBarColor(pct) {
  if (pct >= 75) return 'b-high';
  if (pct >= 50) return 'b-mid';
  return 'b-low';
}

function sbBadgeClass(pct) {
  if (pct === null) return 'sb-none';
  if (pct >= 75) return 'sb-high';
  if (pct >= 50) return 'sb-mid';
  return 'sb-low';
}

function destroyChart(id) {
  if (state.chartInstances[id]) {
    state.chartInstances[id].destroy();
    delete state.chartInstances[id];
  }
}

function setLoadingText(main, sub) {
  document.getElementById('loading-text').textContent = main;
  if (sub !== undefined) document.getElementById('loading-sub').textContent = sub || '';
}

function setProgress(pct) {
  document.getElementById('progress-bar').style.width = pct + '%';
}

function hideLoading() {
  document.getElementById('loading').classList.add('hidden');
}

// ─────────────────────────────────────────────────────────────────────────────
// UI — SIDEBAR
// ─────────────────────────────────────────────────────────────────────────────
function buildSidebarSquads() {
  const list = document.getElementById('squad-list');
  list.innerHTML = JIRA_CONFIG.squads.map(squad => {
    const d = state.squadData[squad];
    let badgeHtml = '';

    if (d && !d.error && d.sprints.length > 0) {
      const bot   = d.sprints.reduce((s, x) => s + x.botCount,   0);
      const total = d.sprints.reduce((s, x) => s + x.totalCount, 0);
      const pct   = total > 0 ? Math.round((bot / total) * 100) : 0;
      const cls   = sbBadgeClass(pct);
      badgeHtml   = `<span class="sq-badge ${cls}">${pct}%</span>`;
    } else if (d && d.error) {
      badgeHtml = `<span class="sq-badge sb-none">—</span>`;
    }

    return `<div class="sidebar-item" data-view="${squad}" onclick="switchView('${squad}')">
              ${squad}${badgeHtml}
            </div>`;
  }).join('');
}

// ─────────────────────────────────────────────────────────────────────────────
// UI — GLOBAL VIEW
// ─────────────────────────────────────────────────────────────────────────────
function renderGlobalView() {
  const g = state.globalStats;
  if (!g) return;

  document.getElementById('view-global').innerHTML = `
    <div class="view-header">
      <div class="view-title">Vista global</div>
      <div class="view-sub">
        Todos los squads
        &nbsp;·&nbsp;
        ${g.sprintsCount} sprint${g.sprintsCount !== 1 ? 's' : ''} analizados
        &nbsp;·&nbsp;
        Desde 24 Feb 2025
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Tasks del bot (total)</div>
        <div class="kpi-value" style="color:#2563eb">${g.totalBotTasks.toLocaleString('es-AR')}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Sprints analizados</div>
        <div class="kpi-value" style="color:#0891b2">${g.sprintsCount}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Squads activos</div>
        <div class="kpi-value" style="color:#7c3aed">${g.activeSquads}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Adopción promedio</div>
        <div class="kpi-value ${adoptionColor(g.avgAdoption)}">${g.avgAdoption}%</div>
      </div>
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title">Evolución sprint a sprint — todos los squads</div>
        <canvas id="chart-global-evolution" height="200"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title">Ranking de squads por adopción</div>
        <div class="rank-list" id="ranking-list"></div>
      </div>
    </div>

    <div class="last-updated">Actualizado: ${new Date().toLocaleString('es-AR')}</div>
  `;

  renderGlobalEvolutionChart(g);
  renderRankingList(g);
}

function renderGlobalEvolutionChart(g) {
  destroyChart('global-evolution');
  const labels = g.evolution.map(e => e.name);
  const values = g.evolution.map(e => e.botCount);

  state.chartInstances['global-evolution'] = new Chart(
    document.getElementById('chart-global-evolution'),
    {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'Tasks del bot',
          data: values,
          backgroundColor: '#3b82f6',
          borderRadius: 5,
          borderSkipped: false
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ` ${ctx.parsed.y} tasks del bot`
            }
          }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: { font: { size: 11 }, maxRotation: 40 }
          },
          y: {
            beginAtZero: true,
            grid: { color: '#f1f5f9' },
            ticks: { font: { size: 11 }, precision: 0 }
          }
        }
      }
    }
  );
}

function renderRankingList(g) {
  const maxAdoption = g.ranking.length > 0 ? g.ranking[0].adoption : 100;

  document.getElementById('ranking-list').innerHTML = g.ranking.map((r, i) => `
    <div class="rank-row">
      <div class="rank-idx">${i + 1}</div>
      <div class="rank-name">${r.squad}</div>
      <div class="rank-bar-wrap">
        <div class="rank-bar ${adoptionBarColor(r.adoption)}"
             style="width:${maxAdoption > 0 ? Math.round((r.adoption / maxAdoption) * 100) : 0}%">
        </div>
      </div>
      <div class="rank-pct ${adoptionColor(r.adoption)}">${r.adoption}%</div>
    </div>
  `).join('');
}

// ─────────────────────────────────────────────────────────────────────────────
// UI — SQUAD VIEW
// ─────────────────────────────────────────────────────────────────────────────
function renderSquadView(squad) {
  const d = state.squadData[squad];

  if (!d || (d.error && d.sprints.length === 0)) {
    document.getElementById('view-squad').innerHTML = `
      <div class="view-header">
        <div class="view-title">${squad}</div>
        <div class="view-sub">${d?.error || 'Sin datos disponibles'}</div>
      </div>
      <div class="empty-state">No hay datos para este squad en el período analizado.</div>
    `;
    return;
  }

  const totalBot   = d.sprints.reduce((s, x) => s + x.botCount,   0);
  const totalAll   = d.sprints.reduce((s, x) => s + x.totalCount, 0);
  const adoption   = totalAll > 0 ? Math.round((totalBot / totalAll) * 100) : 0;

  const lastSprint     = d.sprints[d.sprints.length - 1];
  const prevSprint     = d.sprints.length >= 2 ? d.sprints[d.sprints.length - 2] : null;
  const lastAdoption   = lastSprint.totalCount > 0
    ? Math.round((lastSprint.botCount / lastSprint.totalCount) * 100)
    : 0;

  // Trend
  let trendHtml = '';
  if (prevSprint) {
    const prevAdoption = prevSprint.totalCount > 0
      ? Math.round((prevSprint.botCount / prevSprint.totalCount) * 100)
      : 0;
    const diff = lastAdoption - prevAdoption;
    const cls  = diff > 0 ? 'trend-up' : diff < 0 ? 'trend-down' : 'trend-flat';
    const icon = diff > 0 ? '↑' : diff < 0 ? '↓' : '→';
    trendHtml  = `<span class="trend ${cls}">${icon} ${Math.abs(diff)}% vs sprint anterior</span>`;
  }

  document.getElementById('view-squad').innerHTML = `
    <div class="view-header">
      <div class="view-title">${squad}</div>
      <div class="view-sub">
        ${d.sprints[0].name} → ${lastSprint.name}
        ${trendHtml}
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Tasks del bot</div>
        <div class="kpi-value" style="color:#2563eb">${totalBot}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total tasks squad</div>
        <div class="kpi-value" style="color:#334155">${totalAll}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Adopción acumulada</div>
        <div class="kpi-value ${adoptionColor(adoption)}">${adoption}%</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Adopción último sprint</div>
        <div class="kpi-value ${adoptionColor(lastAdoption)}">${lastAdoption}%</div>
      </div>
    </div>

    <div class="charts-row single">
      <div class="chart-card">
        <div class="chart-title">Evolución de ${squad} por sprint</div>
        <canvas id="chart-squad-evolution" height="200"></canvas>
      </div>
    </div>

    <div class="last-updated">Actualizado: ${new Date().toLocaleString('es-AR')}</div>
  `;

  renderSquadEvolutionChart(squad, d);
}

function renderSquadEvolutionChart(squad, d) {
  destroyChart('squad-evolution');

  const labels     = d.sprints.map(s => s.name);
  const botCounts  = d.sprints.map(s => s.botCount);
  const totalCounts = d.sprints.map(s => s.totalCount);

  state.chartInstances['squad-evolution'] = new Chart(
    document.getElementById('chart-squad-evolution'),
    {
      type: 'bar',
      data: {
        labels,
        datasets: [
          {
            label: 'Total tasks squad',
            data: totalCounts,
            backgroundColor: '#e2e8f0',
            borderRadius: 5,
            borderSkipped: false,
            order: 2
          },
          {
            label: 'Tasks del bot',
            data: botCounts,
            backgroundColor: '#6366f1',
            borderRadius: 5,
            borderSkipped: false,
            order: 1
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            display: true,
            position: 'top',
            labels: { font: { size: 12 }, boxWidth: 14, padding: 16 }
          },
          tooltip: {
            callbacks: {
              afterBody: (items) => {
                const bot   = items.find(i => i.dataset.label === 'Tasks del bot')?.parsed.y   ?? 0;
                const total = items.find(i => i.dataset.label === 'Total tasks squad')?.parsed.y ?? 0;
                const pct   = total > 0 ? Math.round((bot / total) * 100) : 0;
                return [`Adopción: ${pct}%`];
              }
            }
          }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: { font: { size: 11 }, maxRotation: 40 }
          },
          y: {
            beginAtZero: true,
            grid: { color: '#f1f5f9' },
            ticks: { font: { size: 11 }, precision: 0 }
          }
        }
      }
    }
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────────────────────────────────────
function switchView(view) {
  state.currentView = view;

  document.querySelectorAll('.sidebar-item').forEach(el => {
    el.classList.toggle('active', el.dataset.view === view);
  });

  const isGlobal = view === 'global';
  document.getElementById('view-global').style.display = isGlobal ? '' : 'none';
  document.getElementById('view-squad').style.display  = isGlobal ? 'none' : '';

  if (isGlobal) renderGlobalView();
  else          renderSquadView(view);
}

// ─────────────────────────────────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────────────────────────────────
(async () => {
  try {
    const squads = JIRA_CONFIG.squads;
    let loaded = 0;

    setLoadingText('Cargando datos desde Jira...', `0 / ${squads.length} squads`);

    // Load all squads in parallel, updating progress as each resolves
    const results = await Promise.all(
      squads.map(squad =>
        loadSquad(squad).then(result => {
          loaded++;
          const pct = Math.round((loaded / squads.length) * 100);
          setProgress(pct);
          setLoadingText(
            `Cargando ${squad}...`,
            `${loaded} / ${squads.length} squads`
          );
          return result;
        })
      )
    );

    squads.forEach((squad, i) => { state.squadData[squad] = results[i]; });
    state.globalStats = computeGlobalStats();

    buildSidebarSquads();
    renderGlobalView();
    hideLoading();

  } catch (err) {
    document.getElementById('loading-text').textContent = '⚠ Error al conectar con Jira';
    document.getElementById('loading-sub').textContent  = err.message;
    document.getElementById('progress-bar-wrap').style.display = 'none';
  }
})();
</script>
</body>
</html>
